name: Publish Downstream ScriptC

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-downstream-scriptc
  cancel-in-progress: false

jobs:
  publish:
    name: Publish already-tested downstream release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout promoted release branch
        uses: actions/checkout@v7
        with:
          ref: downstream-release
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"

      - name: Derive package version
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE_VERSION="$(
            node -p "require('./packages/compiler/package.json').version"
          )"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          CUSTOM_VERSION="${BASE_VERSION}-downstream.g${SHORT_SHA}"

          {
            echo "BASE_VERSION=$BASE_VERSION"
            echo "CUSTOM_VERSION=$CUSTOM_VERSION"
          } >> "$GITHUB_ENV"

          echo "Release SHA:    $(git rev-parse HEAD)"
          echo "Base version:   $BASE_VERSION"
          echo "Custom version: $CUSTOM_VERSION"

      - name: Verify official matching runtime packages
        run: |
          npm view "@scriptc/compiler@$BASE_VERSION" version \
            --registry="https://registry.npmjs.org" >/dev/null

          npm view "@scriptc/runtime@$BASE_VERSION" version \
            --registry="https://registry.npmjs.org" >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package artifacts
        run: |
          pnpm build
          pnpm manifest --check

      - name: Stage custom GitHub Packages
        run: |
          STAGE_ROOT="$RUNNER_TEMP/scriptc-packages"
          COMPILER_STAGE="$STAGE_ROOT/compiler"
          CLI_STAGE="$STAGE_ROOT/cli"

          mkdir -p "$COMPILER_STAGE" "$CLI_STAGE"

          cp packages/compiler/package.json "$COMPILER_STAGE/"
          cp -R packages/compiler/dist "$COMPILER_STAGE/"
          cp -R packages/compiler/ambient "$COMPILER_STAGE/"
          cp packages/compiler/surface-manifest.json "$COMPILER_STAGE/"

          cp packages/cli/package.json "$CLI_STAGE/"
          cp -R packages/cli/dist "$CLI_STAGE/"
          cp -R packages/cli/scripts "$CLI_STAGE/"

          STAGE_ROOT="$STAGE_ROOT" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const root = process.env.STAGE_ROOT;
          const owner = process.env.GITHUB_REPOSITORY_OWNER.toLowerCase();
          const repo = process.env.GITHUB_REPOSITORY;
          const version = process.env.CUSTOM_VERSION;
          const baseVersion = process.env.BASE_VERSION;
          const registry = "https://npm.pkg.github.com";

          const read = p => JSON.parse(fs.readFileSync(p, "utf8"));
          const write = (p, value) =>
            fs.writeFileSync(p, JSON.stringify(value, null, 2) + "\n");

          const compilerDir = path.join(root, "compiler");
          const compilerPath = path.join(compilerDir, "package.json");
          const compiler = read(compilerPath);
          const compilerName = `@${owner}/scriptc-compiler`;

          compiler.name = compilerName;
          compiler.version = version;
          compiler.repository = {
            type: "git",
            url: `git+https://github.com/${repo}.git`,
            directory: "packages/compiler"
          };
          compiler.publishConfig = {
            ...(compiler.publishConfig || {}),
            registry
          };

          for (const group of ["dependencies", "optionalDependencies"]) {
            if (!compiler[group]) continue;

            for (const [name, spec] of Object.entries(compiler[group])) {
              if (typeof spec === "string" && spec.startsWith("workspace:")) {
                compiler[group][name] = baseVersion;
              }
            }
          }

          write(compilerPath, compiler);

          // The compiler resolves its shipped declaration files through its
          // own package name. This downstream package is renamed from
          // @scriptc/compiler to @<owner>/scriptc-compiler, so rewrite those
          // built self-references before publishing.
          const rewriteCompilerSelfRefs = dir => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                rewriteCompilerSelfRefs(file);
                continue;
              }

              if (!entry.isFile()) continue;

              const source = fs.readFileSync(file, "utf8");
              const rewritten = source.replaceAll(
                "@scriptc/compiler/",
                `${compilerName}/`
              );

              if (rewritten !== source) {
                fs.writeFileSync(file, rewritten);
                console.log(`Rewrote compiler self-reference in ${file}`);
              }
            }
          };

          rewriteCompilerSelfRefs(path.join(compilerDir, "dist"));

          const manifestPath = path.join(compilerDir, "surface-manifest.json");
          const manifest = read(manifestPath);
          manifest.compilerVersion = baseVersion;
          write(manifestPath, manifest);

          const cliDir = path.join(root, "cli");
          const cliPath = path.join(cliDir, "package.json");
          const cli = read(cliPath);

          cli.name = `@${owner}/scriptc`;
          cli.version = version;
          cli.repository = {
            type: "git",
            url: `git+https://github.com/${repo}.git`,
            directory: "packages/cli"
          };
          cli.publishConfig = {
            ...(cli.publishConfig || {}),
            registry
          };

          cli.dependencies = cli.dependencies || {};
          cli.dependencies["@scriptc/compiler"] =
            `npm:${compilerName}@${version}`;

          write(cliPath, cli);
          NODE

          echo "STAGE_ROOT=$STAGE_ROOT" >> "$GITHUB_ENV"

      - name: Publish custom compiler and CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          publish_if_missing() {
            dir="$1"

            name="$(
              node -e \
                'console.log(require(process.argv[1]).name)' \
                "$dir/package.json"
            )"

            if npm view "$name@$CUSTOM_VERSION" version \
              --registry="https://npm.pkg.github.com" >/dev/null 2>&1; then
              echo "$name@$CUSTOM_VERSION already published; skipping"
              return 0
            fi

            npm publish "$dir" \
              --registry="https://npm.pkg.github.com" \
              --tag downstream
          }

          publish_if_missing "$STAGE_ROOT/compiler"
          publish_if_missing "$STAGE_ROOT/cli"

      - name: Summary
        run: |
          OWNER="$(
            printf '%s' "$GITHUB_REPOSITORY_OWNER" |
              tr '[:upper:]' '[:lower:]'
          )"

          {
            echo "## ScriptC downstream published"
            echo
            echo "- Release SHA: \`$(git rev-parse HEAD)\`"
            echo "- Version: \`$CUSTOM_VERSION\`"
            echo "- Compiler: \`@$OWNER/scriptc-compiler@$CUSTOM_VERSION\`"
            echo "- CLI: \`@$OWNER/scriptc@$CUSTOM_VERSION\`"
            echo "- Dist-tag: \`downstream\`"
            echo
            echo "No test suite was run by this recovery workflow."
          } >> "$GITHUB_STEP_SUMMARY"
